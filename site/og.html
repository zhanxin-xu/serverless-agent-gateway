<!doctype html>
<!-- Source of og.png (1280×640). Re-render with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1280,640 --screenshot=og.png og.html
     then raise the ?v= on og.png in index.html: the picture is cached for a year. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    box-sizing: border-box; padding: 52px 72px 50px; display: flex; flex-direction: column;
    background: #f6f8fc; color: #0d1016;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .top { display: flex; align-items: center; justify-content: space-between; padding-bottom: 26px; border-bottom: 1px solid rgba(13, 16, 22, .15); }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .brand img { width: 40px; height: 40px; border-radius: 50%; display: block; }
  .brand em { font-style: normal; font-weight: 400; color: #5b6475; }
  .top .mono { font-size: 16px; color: #5b6475; letter-spacing: .02em; }
  .mid { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 48px; }
  .kicker { margin: 0 0 22px; font-size: 16px; letter-spacing: .08em; color: #2f5de6; }
  h1 { margin: 0 0 24px; font-size: 92px; font-weight: 600; letter-spacing: -.04em; line-height: 1.1; }
  .lead { margin: 0; font-size: 24px; line-height: 1.5; color: #474e5c; }
  .face { flex: none; width: 250px; height: 250px; padding: 13px; border-radius: 50%; border: 1px solid rgba(13, 16, 22, .15); }
  .face img { width: 100%; height: 100%; border-radius: 50%; display: block; }
  .foot { display: grid; grid-template-columns: 1fr 1.35fr 1.15fr; gap: 40px; padding-top: 22px; border-top: 1px solid rgba(13, 16, 22, .15); }
  .foot dt { margin: 0 0 8px; font: 500 13px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .1em; color: #5b6475; }
  .foot dd { margin: 0; font-size: 19px; font-weight: 500; letter-spacing: -.005em; }
  .foot dd i { font-style: normal; color: #a3aab8; margin: 0 .35em; }
  dl { margin: 0; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><img src="logo.png" alt=""><span>Serverless Agent <em>Gateway</em></span></div>
    <span class="mono">serverless-agent.cnday.cn</span>
  </div>
  <div class="mid">
    <div>
      <p class="kicker mono">开源 MIT · 跑在 Vercel Functions 上</p>
      <h1>免服务器的群聊<br>全能 Agent 网关</h1>
      <p class="lead">把 QQ、Telegram 的消息接进来，跑一个会用工具的 agent。<br>有消息才运行，没人说话就不花钱。</p>
    </div>
    <div class="face"><img src="logo.png" alt=""></div>
  </div>
  <dl class="foot">
    <div><dt>渠道</dt><dd>QQ<i>·</i>Telegram<i>·</i>HTTP</dd></div>
    <div><dt>自带</dt><dd>搜索<i>·</i>记忆<i>·</i>画图<i>·</i>语音<i>·</i>代码沙盒</dd></div>
    <div><dt>跑在</dt><dd>Vercel<i>·</i>Supabase<i>·</i>Upstash</dd></div>
  </dl>
</body>
</html>
